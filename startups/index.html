
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f5f5f3;--bg3:#e8e8e5;--text:#1a1a1a;--text2:#6b6b6b;--text3:#aaaaaa;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.2);--link:#185FA5;--accent:#185FA5}
[data-theme=dark]{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.18);--link:#85B7EB;--accent:#85B7EB}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;color:var(--text);background:transparent}
.app{padding:0.75rem 0 1rem}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.75rem;gap:8px;flex-wrap:wrap}
.app-title{font-size:15px;font-weight:600;color:var(--text)}
.meta-info{font-size:11px;color:var(--text3);margin-top:3px}
.theme-btn{padding:5px 12px;border-radius:8px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:12px;flex-shrink:0;margin-top:2px}
.theme-btn:hover{background:var(--bg3);color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:0.75rem;align-items:flex-start}
.search-wrap{flex:1;min-width:200px}
.search-wrap input{width:100%;height:34px;padding:0 10px;border:0.5px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--accent)}
.ms-wrap{position:relative}
.ms-trigger{height:34px;padding:0 8px 0 10px;border:0.5px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;min-width:145px}
.ms-trigger:hover{border-color:var(--accent)}
.ms-trigger .arr{font-size:9px;color:var(--text3);margin-left:auto;transition:transform 0.15s;padding-left:2px}
.ms-trigger.open .arr{transform:rotate(180deg)}
.ms-count{background:var(--accent);color:#fff;font-size:10px;border-radius:9999px;padding:1px 6px;font-weight:500}
.ms-dd{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:230px;max-height:280px;overflow-y:auto;background:var(--bg);border:0.5px solid var(--border2);border-radius:10px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.ms-dd.open{display:block}
.ms-header{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:1}
.ms-header input{flex:1;height:27px;padding:0 8px;border:0.5px solid var(--border2);border-radius:6px;background:var(--bg2);color:var(--text);font-size:12px;outline:none}
.ms-clear-btn{height:27px;padding:0 9px;border-radius:6px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.ms-clear-btn:hover{background:var(--bg3);color:var(--text)}
.ms-item{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;font-size:13px;color:var(--text)}
.ms-item:hover{background:var(--bg2)}
.cb{width:14px;height:14px;border:1.5px solid var(--border2);border-radius:3px;flex-shrink:0;background:var(--bg);position:relative}
.ms-item.sel .cb{background:var(--accent);border-color:var(--accent)}
.ms-item.sel .cb::after{content:'';position:absolute;left:2px;top:1px;width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg)}
.ms-item.sel{color:var(--accent)}
.ms-freq{font-size:11px;color:var(--text3);margin-left:auto;padding-left:8px;flex-shrink:0}
.fi.fis{width:1.33em;height:1em;border-radius:2px;flex-shrink:0;vertical-align:middle}
.sel-wrap select{height:34px;padding:0 8px;border:0.5px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;outline:none;cursor:pointer;min-width:110px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:0.75rem}
.stat{background:var(--bg2);border-radius:8px;padding:7px 13px;font-size:12px;color:var(--text2)}
.stat b{display:block;font-size:17px;font-weight:500;color:var(--text)}
.table-wrap{overflow-x:auto;border:0.5px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
col.c-name{width:155px}col.c-web{width:140px}col.c-tech{width:108px}col.c-cc{width:88px}col.c-yr{width:52px}col.c-desc{width:auto}
th{background:var(--bg2);font-size:12px;font-weight:500;color:var(--text2);padding:8px 10px;text-align:left;cursor:pointer;user-select:none;border-bottom:0.5px solid var(--border);white-space:nowrap}
th.nosort{cursor:default}
th:not(.nosort):hover{color:var(--text)}
th.asc::after{content:" ↑";color:var(--accent)}
th.desc::after{content:" ↓";color:var(--accent)}
td{padding:7px 10px;border-bottom:0.5px solid var(--border);font-size:13px;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.link{color:var(--link);text-decoration:none;font-size:12px}
.link:hover{text-decoration:underline}
.empty{padding:2rem;text-align:center;color:var(--text2);font-size:13px}
.cc-cell{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);font-weight:500}
.footer{margin-top:1.25rem;padding:12px 0 2px;border-top:0.5px solid var(--border);display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}
.footer-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.footer-item a{color:var(--text3);text-decoration:none;border-bottom:0.5px solid var(--border2);padding-bottom:1px;transition:color 0.15s}
.footer-item a:hover{color:var(--text2)}
.footer-dot{color:var(--border2);font-size:14px;line-height:1}
</style>

<div class="app" id="app" data-theme="light">
  <div class="topbar">
    <div>
      <div class="app-title">Semiconductor Startups</div>
      <div class="meta-info" id="meta-info">Fetching data…</div>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="cycleTheme()">Light</button>
  </div>
  <div class="toolbar">
    <div class="search-wrap"><input type="text" id="search" placeholder="Search name, technology, description..."></div>
    <div class="ms-wrap" id="mw-cc">
      <div class="ms-trigger" id="mt-cc" onclick="toggleMS('cc')"><span id="ml-cc">Country</span><span class="arr">▼</span></div>
      <div class="ms-dd" id="md-cc">
        <div class="ms-header"><input type="text" placeholder="Search…" id="ms-cc-q" oninput="renderMSList('cc',this.value)"><button class="ms-clear-btn" onclick="clearMS('cc');event.stopPropagation()">Clear all</button></div>
        <div id="ml-cc-items"></div>
      </div>
    </div>
    <div class="ms-wrap" id="mw-tech">
      <div class="ms-trigger" id="mt-tech" onclick="toggleMS('tech')"><span id="ml-tech">Technology</span><span class="arr">▼</span></div>
      <div class="ms-dd" id="md-tech">
        <div class="ms-header"><input type="text" placeholder="Search…" id="ms-tech-q" oninput="renderMSList('tech',this.value)"><button class="ms-clear-btn" onclick="clearMS('tech');event.stopPropagation()">Clear all</button></div>
        <div id="ml-tech-items"></div>
      </div>
    </div>
    <div class="sel-wrap">
      <select id="f-year" onchange="applyFilters()">
        <option value="">All years</option><option value="2020">2020+</option><option value="2015">2015–2019</option><option value="old">Before 2015</option>
      </select>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="s-total">–</b>total</div>
    <div class="stat"><b id="s-showing">–</b>showing</div>
    <div class="stat"><b id="s-cc">–</b>countries</div>
    <div class="stat"><b id="s-new">–</b>founded 2020+</div>
  </div>
  <div class="table-wrap">
    <table>
      <colgroup><col class="c-name"><col class="c-web"><col class="c-tech"><col class="c-cc"><col class="c-yr"><col class="c-desc"></colgroup>
      <thead><tr>
        <th onclick="sortBy('name',this)">Company</th>
        <th class="nosort">Website</th>
        <th onclick="sortBy('technology',this)">Technology</th>
        <th onclick="sortBy('cc',this)">Country</th>
        <th onclick="sortBy('founded',this)">Year</th>
        <th onclick="sortBy('description',this)">Description</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
  <footer class="footer">
    <div class="footer-item">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      Data: <a href="https://github.com/aolofsson/awesome-semiconductor-startups" target="_blank">aolofsson / awesome-semiconductor-startups</a>
    </div>
    <div class="footer-dot">·</div>
    <div class="footer-item">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Flags: <a href="https://github.com/lipis/flag-icons" target="_blank">lipis / flag-icons</a> via jsDelivr
    </div>
  </footer>
</div>

<script>
const RAW='https://raw.githubusercontent.com/aolofsson/awesome-semiconductor-startups/main/startups.csv';
const GH_API='https://api.github.com/repos/aolofsson/awesome-semiconductor-startups/commits?path=startups.csv&per_page=1';

const CC_MAP={
  'United States':'us','USA':'us','US':'us',
  'United Kingdom':'gb','UK':'gb','Britain':'gb','Great Britain':'gb',
  'England':'gb','Scotland':'gb','Wales':'gb','Northern Ireland':'gb',
  'Germany':'de','France':'fr','Netherlands':'nl','Switzerland':'ch',
  'Canada':'ca','Israel':'il','China':'cn','South Korea':'kr','Korea':'kr',
  'India':'in','Australia':'au','Belgium':'be','Norway':'no','Finland':'fi',
  'Spain':'es','Italy':'it','Denmark':'dk','Singapore':'sg','Romania':'ro',
  'Ireland':'ie','Portugal':'pt','Austria':'at','Sweden':'se','Japan':'jp',
  'Taiwan':'tw','Brazil':'br','Mexico':'mx','Poland':'pl','Greece':'gr',
  'Czech Republic':'cz','Hungary':'hu','Ukraine':'ua','Russia':'ru',
  'New Zealand':'nz','South Africa':'za','UAE':'ae','United Arab Emirates':'ae',
  'Turkey':'tr','Argentina':'ar','Chile':'cl','Colombia':'co',
  'Estonia':'ee','Latvia':'lv','Lithuania':'lt','Slovakia':'sk',
  'Bulgaria':'bg','Croatia':'hr','Serbia':'rs','Slovenia':'si',
  'Luxembourg':'lu','Iceland':'is',
};

function resolveCountry(raw){
  if(!raw||raw==='N/A')return{cc:null,displayCC:'N/A'};
  if(/^[A-Za-z]{2}$/.test(raw.trim())){
    const lower=raw.trim().toLowerCase();
    const normalised=lower==='uk'?'gb':lower;
    return{cc:normalised,displayCC:normalised.toUpperCase()};
  }
  const mapped=CC_MAP[raw.trim()];
  if(mapped)return{cc:mapped,displayCC:mapped.toUpperCase()};
  return{cc:null,displayCC:raw.trim().slice(0,2).toUpperCase()};
}

function flagSpan(cc,size=15){
  if(!cc)return '';
  return `<span class="fi fi-${cc} fis" style="font-size:${size}px;border-radius:2px"></span>`;
}

let all=[],visible=[],sortCol='name',sortDir=1;
let selCC=new Set(),selTech=new Set();
let ccFreq={},techFreq={},ccItems=[],techItems=[];

function parseCSV(txt){
  const lines=txt.trim().split('\n'),rows=[];
  for(let i=1;i<lines.length;i++){
    const vals=[];let cur='',q=false;
    for(const c of lines[i]){if(c==='"'){q=!q}else if(c===','&&!q){vals.push(cur.trim());cur='';}else cur+=c;}
    vals.push(cur.trim());
    let[name='',website='',technology='',country='',founded='',description='']=vals;
    if(!name)continue;
    if(/^\d{4}$/.test(country)){founded=country;country='N/A';}
    if(!country)country='N/A';
    const{cc,displayCC}=resolveCountry(country);
    // normalise full URL to lowercase, then extract display domain
    if(website&&!website.startsWith('http'))website='https://'+website;
    website=website.toLowerCase();
    const domain=website?website.replace(/https?:\/\//,'').replace(/\/.*$/,''):'';
    rows.push({name,website,domain,technology,country,cc,displayCC,founded:founded.trim(),description});
  }
  return rows;
}

function buildFreq(){
  ccFreq={};techFreq={};
  all.forEach(r=>{
    if(r.displayCC&&r.displayCC!=='N/A')ccFreq[r.displayCC]=(ccFreq[r.displayCC]||0)+1;
    if(r.technology)techFreq[r.technology]=(techFreq[r.technology]||0)+1;
  });
  ccItems=Object.entries(ccFreq).sort((a,b)=>b[1]-a[1]).map(([v,n])=>({v,n}));
  techItems=Object.entries(techFreq).sort((a,b)=>b[1]-a[1]).map(([v,n])=>({v,n}));
}

function displayCCtoFlagCode(displayCC){
  const entry=Object.entries(CC_MAP).find(([,code])=>code.toUpperCase()===displayCC);
  if(entry)return entry[1];
  return displayCC.toLowerCase();
}

function renderMSList(type,q=''){
  const items=type==='cc'?ccItems:techItems;
  const sel=type==='cc'?selCC:selTech;
  const el=document.getElementById('ml-'+type+'-items');
  const fq=q.toLowerCase();
  const list=fq?items.filter(i=>i.v.toLowerCase().includes(fq)):items;
  if(type==='cc'){
    el.innerHTML=list.map(({v,n})=>{
      const fc=displayCCtoFlagCode(v);
      return`<div class="ms-item${sel.has(v)?' sel':''}" onclick="toggleMSItem('cc','${v}',this)">
        <div class="cb"></div>${flagSpan(fc,16)}<span>${v}</span><span class="ms-freq">${n}</span>
      </div>`;
    }).join('');
  } else {
    el.innerHTML=list.map(({v,n})=>`<div class="ms-item${sel.has(v)?' sel':''}" onclick="toggleMSItem('tech','${v.replace(/'/g,"\\'")}',this)">
      <div class="cb"></div><span>${v}</span><span class="ms-freq">${n}</span>
    </div>`).join('');
  }
}

function toggleMSItem(type,val,el){
  const sel=type==='cc'?selCC:selTech;
  if(sel.has(val))sel.delete(val);else sel.add(val);
  el.classList.toggle('sel');
  updateMSLabel(type);applyFilters();
}

function updateMSLabel(type){
  const sel=type==='cc'?selCC:selTech;
  const base=type==='cc'?'Country':'Technology';
  const lbl=document.getElementById('ml-'+type);
  if(sel.size===0){lbl.textContent=base;}
  else if(sel.size===1){
    const v=[...sel][0];
    if(type==='cc'){
      const fc=displayCCtoFlagCode(v);
      lbl.innerHTML=flagSpan(fc,14)+'<span style="margin-left:4px">'+v+'</span>';
    } else {
      lbl.textContent=v.length>18?v.slice(0,16)+'…':v;
    }
  } else {
    lbl.innerHTML=base+' <span class="ms-count">'+sel.size+'</span>';
  }
}

function toggleMS(type){
  const dd=document.getElementById('md-'+type);
  const tr=document.getElementById('mt-'+type);
  const wasOpen=dd.classList.contains('open');
  document.querySelectorAll('.ms-dd').forEach(d=>d.classList.remove('open'));
  document.querySelectorAll('.ms-trigger').forEach(t=>t.classList.remove('open'));
  if(!wasOpen){
    dd.classList.add('open');tr.classList.add('open');
    renderMSList(type);
    setTimeout(()=>document.getElementById('ms-'+type+'-q').focus(),40);
  }
}

function clearMS(type){
  const sel=type==='cc'?selCC:selTech;
  sel.clear();
  renderMSList(type,document.getElementById('ms-'+type+'-q').value);
  updateMSLabel(type);applyFilters();
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.ms-wrap')){
    document.querySelectorAll('.ms-dd').forEach(d=>d.classList.remove('open'));
    document.querySelectorAll('.ms-trigger').forEach(t=>t.classList.remove('open'));
  }
});

function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  const fy=document.getElementById('f-year').value;
  visible=all.filter(r=>{
    if(q&&!(r.name+' '+r.technology+' '+r.description+' '+r.displayCC).toLowerCase().includes(q))return false;
    if(selCC.size&&!selCC.has(r.displayCC))return false;
    if(selTech.size&&!selTech.has(r.technology))return false;
    const y=parseInt(r.founded);
    if(fy==='2020'&&(isNaN(y)||y<2020))return false;
    if(fy==='2015'&&(isNaN(y)||y<2015||y>=2020))return false;
    if(fy==='old'&&(isNaN(y)||y>=2015))return false;
    return true;
  });
  visible.sort((a,b)=>{
    let va=a[sortCol]||'',vb=b[sortCol]||'';
    if(sortCol==='founded'){va=parseInt(va)||0;vb=parseInt(vb)||0;return(va-vb)*sortDir;}
    if(sortCol==='cc'){va=a.displayCC||'';vb=b.displayCC||'';}
    return va.toString().toLowerCase()<vb.toString().toLowerCase()?-sortDir:sortDir;
  });
  renderTable();updateStats();
}

function renderTable(){
  const tb=document.getElementById('tbody');
  if(!visible.length){tb.innerHTML='<tr><td colspan="6" class="empty">No matches.</td></tr>';return;}
  tb.innerHTML=visible.map(r=>`<tr>
    <td title="${r.name}" style="font-weight:500">${r.name}</td>
    <td>${r.domain?`<a class="link" href="${r.website}" target="_blank">${r.domain}</a>`:'–'}</td>
    <td>${r.technology||'–'}</td>
    <td><div class="cc-cell">${flagSpan(r.cc,15)}<span>${r.displayCC}</span></div></td>
    <td style="color:var(--text2)">${r.founded||'–'}</td>
    <td title="${r.description}" style="color:var(--text2)">${r.description||'–'}</td>
  </tr>`).join('');
}

function updateStats(){
  const newCo=all.filter(r=>{const y=parseInt(r.founded);return !isNaN(y)&&y>=2020;}).length;
  document.getElementById('s-total').textContent=all.length;
  document.getElementById('s-showing').textContent=visible.length;
  document.getElementById('s-cc').textContent=new Set(visible.map(r=>r.displayCC).filter(c=>c&&c!=='N/A')).size;
  document.getElementById('s-new').textContent=newCo;
}

function sortBy(col,th){
  if(sortCol===col)sortDir=-sortDir;else{sortCol=col;sortDir=1;}
  document.querySelectorAll('th:not(.nosort)').forEach(t=>t.classList.remove('asc','desc'));
  th.classList.add(sortDir===1?'asc':'desc');
  applyFilters();
}

let themeMode='light';
function applyTheme(){
  const labels={light:'Light',dark:'Dark',auto:'Auto'};
  const h=new Date().getHours();
  const resolved=themeMode==='auto'?(h>=7&&h<19?'light':'dark'):themeMode;
  document.getElementById('app').setAttribute('data-theme',resolved);
  document.getElementById('theme-btn').textContent=labels[themeMode];
}
function cycleTheme(){themeMode=themeMode==='light'?'dark':themeMode==='dark'?'auto':'light';applyTheme();}
applyTheme();

document.getElementById('search').addEventListener('input',applyFilters);

Promise.all([
  fetch(RAW).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}),
  fetch(GH_API,{headers:{'Accept':'application/vnd.github.v3+json'}}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([csv,commits])=>{
  all=parseCSV(csv);
  buildFreq();
  applyFilters();
  if(commits&&commits[0]){
    const iso=commits[0]?.commit?.committer?.date||commits[0]?.commit?.author?.date;
    if(iso){
      const fmt=new Date(iso).toLocaleDateString('en-CA',{year:'numeric',month:'short',day:'numeric'});
      document.getElementById('meta-info').textContent=`CSV last updated on GitHub: ${fmt}`;
    }
  }
}).catch(err=>{
  document.getElementById('tbody').innerHTML=`<tr><td colspan="6" class="empty">Could not load data (${err.message})</td></tr>`;
  document.getElementById('meta-info').textContent='Failed to load';
});
</script>
